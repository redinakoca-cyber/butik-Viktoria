<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Faqja nuk u gjet · Victoria Boutique</title>
  <meta name="robots" content="noindex, follow" />
  <meta name="theme-color" content="#C9A84C" />
  <link rel="icon" type="image/jpeg" href="/vik.jpeg" />
  <link rel="stylesheet" href="/assets/fonts/fonts.css" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .nf-wrap { min-height: 100vh; display: flex; flex-direction: column; align-items: center;
      justify-content: center; text-align: center; padding: 2rem 1.4rem; gap: 0.4rem; }
    .nf-code { font-family: 'Cormorant Garamond', serif; font-size: clamp(4rem, 14vw, 8rem);
      font-weight: 300; color: var(--gold); line-height: 1; }
    .nf-title { font-family: 'Cormorant Garamond', serif; font-size: clamp(1.5rem, 4vw, 2.2rem);
      font-weight: 300; color: var(--charcoal); margin-bottom: 0.3rem; }
    .nf-sub { color: var(--muted); font-weight: 300; max-width: 44ch; margin: 0 auto 1.6rem; }
    .nf-links { display: flex; gap: 0.7rem; flex-wrap: wrap; justify-content: center; }
    .nf-btn { font-size: 0.66rem; letter-spacing: 0.2em; text-transform: uppercase;
      padding: 0.85rem 1.7rem; text-decoration: none; transition: background 0.3s, transform 0.2s; }
    .nf-btn-gold { background: var(--gold); color: var(--ivory); }
    .nf-btn-gold:hover { background: var(--gold-dark); transform: translateY(-2px); }
    .nf-btn-dark { background: var(--charcoal); color: var(--ivory); }
    .nf-btn-dark:hover { background: #000; transform: translateY(-2px); }
    .nf-langs { margin-top: 1.6rem; font-size: 0.7rem; letter-spacing: 0.15em; color: var(--muted); }
    .nf-langs a { color: var(--charcoal-soft); text-decoration: none; border-bottom: 1px solid var(--gold-light); }
    .nf-langs a:hover { color: var(--gold); }
  </style>
</head>
<body>
  <main class="nf-wrap">
    <div class="nf-code" aria-hidden="true">404</div>
    <h1 class="nf-title">Faqja nuk u gjet</h1>
    <p class="nf-sub">Na vjen keq, kjo faqe nuk ekziston ose është zhvendosur. Kthehuni te
      kryefaqja ose shikoni artikujt tanë në shitje.
      <br /><span lang="en">Page not found — return home or browse the shop.</span>
      <br /><span lang="it">Pagina non trovata — torna alla home o visita lo shop.</span></p>
    <div class="nf-links">
      <a class="nf-btn nf-btn-gold" href="/">Kryefaqja</a>
      <a class="nf-btn nf-btn-dark" href="/shop.html">Dyqani</a>
    </div>
    <p class="nf-langs">
      <a href="/" lang="sq">Shqip</a> &nbsp;·&nbsp;
      <a href="/en/" lang="en">English</a> &nbsp;·&nbsp;
      <a href="/it/" lang="it">Italiano</a>
    </p>
  </main>
</body>
</html>
